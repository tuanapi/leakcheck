<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Has Your Account Been Hacked?</title>
  <meta name="color-scheme" content="dark" />
  <style>
    :root {
      --bg: #000;
      --fg: #f2f2f2;
      --muted: #8a8a8a;
      --dim: #4d4d4d;
      --line: #262626;
      --line-strong: #3a3a3a;
      --mono: ui-monospace, "SF Mono", Menlo, Consolas, monospace;
      --sans: "Helvetica Neue", Helvetica, Arial, sans-serif;
    }

    * { box-sizing: border-box; margin: 0; padding: 0; }

    html { color-scheme: dark; }

    body {
      font-family: var(--sans);
      background: var(--bg);
      color: var(--fg);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      -webkit-font-smoothing: antialiased;
    }

    header, footer {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 22px 32px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.04em;
      text-transform: uppercase;
      color: var(--muted);
    }
    header { border-bottom: 1px solid var(--line); }
    footer { border-top: 1px solid var(--line); }

    .brand { color: var(--fg); font-weight: 600; }

    main {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
      padding: 64px 24px;
    }

    .wrap { width: 100%; max-width: 620px; }

    .index {
      font-family: var(--mono);
      font-size: 12px;
      color: var(--muted);
      letter-spacing: 0.04em;
      margin-bottom: 28px;
    }

    h1 {
      font-size: clamp(40px, 9vw, 72px);
      font-weight: 500;
      line-height: 1;
      letter-spacing: -0.045em;
      margin-bottom: 28px;
    }

    .subtitle {
      color: var(--muted);
      font-size: 15px;
      line-height: 1.7;
      max-width: 46ch;
      margin-bottom: 48px;
    }

    form {
      display: flex;
      border: 1px solid var(--line-strong);
      transition: border-color 0.15s;
    }
    form:focus-within { border-color: var(--fg); }

    input[type="text"] {
      flex: 1;
      min-width: 0;
      background: transparent;
      border: none;
      outline: none;
      padding: 18px 18px;
      color: var(--fg);
      font-family: var(--mono);
      font-size: 15px;
      border-radius: 0;
    }
    input::placeholder { color: var(--dim); }

    button {
      background: var(--fg);
      color: #000;
      border: none;
      border-radius: 0;
      padding: 0 30px;
      font-family: var(--mono);
      font-size: 12.5px;
      font-weight: 600;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      cursor: pointer;
      transition: background 0.15s, color 0.15s;
    }
    button:hover:not(:disabled) { background: #fff; }
    button:disabled { background: var(--line-strong); color: var(--muted); cursor: not-allowed; }

    :focus-visible { outline: 1px solid var(--fg); outline-offset: 3px; }
    input:focus-visible { outline: none; }

    .result {
      display: none;
      margin-top: 32px;
    }
    .result.show { display: block; animation: fade 0.25s ease; }
    @keyframes fade { from { opacity: 0; transform: translateY(4px); } to { opacity: 1; transform: none; } }

    .result.danger {
      background: var(--fg);
      color: #000;
    }
    .result.safe {
      border: 1px solid var(--line-strong);
    }

    .result-head {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 20px;
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
    }
    .danger .result-head { border-bottom: 1px solid rgba(0, 0, 0, 0.2); font-weight: 600; }
    .safe .result-head { color: var(--fg); }
    .result-head .tag { opacity: 0.6; }

    .rows { padding: 4px 20px 8px; }
    .row {
      display: flex;
      justify-content: space-between;
      gap: 24px;
      padding: 16px 0;
    }
    .row + .row { border-top: 1px solid rgba(0, 0, 0, 0.15); }
    .row-label {
      font-family: var(--mono);
      font-size: 12px;
      letter-spacing: 0.06em;
      text-transform: uppercase;
      opacity: 0.6;
      flex-shrink: 0;
    }
    .row-value {
      font-family: var(--mono);
      font-size: 15px;
      word-break: break-all;
      text-align: right;
    }

    .safe-body {
      padding: 4px 20px 20px;
      font-size: 15px;
      line-height: 1.6;
      color: var(--muted);
    }
    .safe-body strong { color: var(--fg); font-weight: 500; word-break: break-all; }

    @media (max-width: 520px) {
      header, footer { padding: 18px 20px; }
      footer { flex-direction: column; gap: 8px; align-items: flex-start; }
      button { padding: 0 20px; }
      main { padding: 40px 20px; }
    }

    @media (prefers-reduced-motion: reduce) {
      * { animation: none !important; transition: none !important; }
    }
  </style>
</head>

    const form = document.getElementById("searchForm");
    const input = document.getElementById("usernameInput");
    const submitBtn = document.getElementById("submitBtn");
    const resultBox = document.getElementById("resultBox");
    const statsFooter = document.getElementById("statsFooter");
    const statusText = document.getElementById("statusText");

    statsFooter.textContent = `${Object.keys(database).length.toLocaleString("en-US")} records loaded`;
    statusText.textContent = "ready";
    submitBtn.disabled = false;

    form.addEventListener("submit", (e) => {
      e.preventDefault();
      const raw = input.value.trim();
      const query = raw.toLowerCase();
      if (!query) return;

      const match = Object.prototype.hasOwnProperty.call(database, query) ? database[query] : null;
      resultBox.className = "result show";

      if (match) {
        resultBox.classList.add("danger");
        resultBox.innerHTML = `

              <span class="row-value">${escapeHtml(match.username)}</span>

              <span class="row-label">Password</span>
              <span class="row-value">${escapeHtml(match.maskedPassword)}</span>
            </div>
          </div>
        `;
      } else {
        resultBox.classList.add("safe");
        resultBox.innerHTML = `
          <div class="result-head"><span>Your account is safe</span><span class="tag">No match</span></div>
          <p class="safe-body"><strong>${escapeHtml(raw)}</strong> was not found in this database.</p>
        `;
      }
    });

    function escapeHtml(str) {
      return String(str)
        .replace(/&/g, "&amp;")
        .replace(/</g, "&lt;")
        .replace(/>/g, "&gt;")
        .replace(/"/g, "&quot;")
        .replace(/'/g, "&#039;");
    }
